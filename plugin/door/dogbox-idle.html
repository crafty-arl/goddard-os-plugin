<!doctype html>
<meta charset="utf-8">
<title>Goddard is napping</title>
<!-- The dog-box browser's resting screen: Goddard (his real PiDog head, eyes shut) asleep on a paper-cut card.
     Carl's picks, 2026-10-29: paper cut card, gold dot, paper sleeping dog. Brand palette from gm-brandkit. -->
<style>
  :root { --ink: #070707; --paper: #F1EEE7; --paper-dim: #C9C4B9; --gold: #BD8430; --kraft: #9C7448; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  body { display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; }
  /* paper cut: torn-ish edge, a hard kraft shadow underneath, a slight tilt */
  .card { position: relative; width: 520px; padding: 48px 40px 36px; background: var(--paper); color: var(--ink); text-align: center;
    transform: rotate(-1.5deg); filter: drop-shadow(10px 12px 0 var(--kraft));
    clip-path: polygon(0 2%, 6% 0, 18% 1.5%, 31% 0, 47% 1%, 62% 0, 78% 1.8%, 92% 0, 100% 1.5%, 99% 22%, 100% 47%, 98.8% 71%, 100% 98%, 88% 100%, 71% 98.6%, 54% 100%, 37% 98.8%, 20% 100%, 4% 98.5%, 0 97%, 1.2% 74%, 0 49%, 1% 24%); }
  .dog { width: 220px; display: block; margin: 0 auto 18px; transform-origin: 50% 90%; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.035, 1.02) translateY(2px) } }
  .led { animation: led 4.2s ease-in-out infinite; }
  .led:nth-child(2) { animation-delay: .25s } .led:nth-child(3) { animation-delay: .5s } .led:nth-child(4) { animation-delay: .75s }
  @keyframes led { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
  .z { position: absolute; font: 400 34px Anton, Impact, sans-serif; color: var(--gold); opacity: 0; animation: z 4.2s ease-out infinite; }
  .z.a { left: 64%; top: 46px } .z.b { left: 70%; top: 30px; font-size: 26px; animation-delay: 1.4s } .z.c { left: 75%; top: 16px; font-size: 20px; animation-delay: 2.8s }
  @keyframes z { 0% { opacity: 0; transform: translate(0, 10px) rotate(-8deg) } 20% { opacity: 1 } 100% { opacity: 0; transform: translate(26px, -34px) rotate(10deg) } }
  h1 { font: 400 44px/1 Anton, Impact, sans-serif; letter-spacing: .01em; margin: 0 0 10px; text-transform: uppercase; }
  h1 b { color: var(--gold); font-weight: 400; }
  p { margin: 0; font-size: 17px; color: #4a463d; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); margin-right: 8px; vertical-align: 1px; animation: led 4.2s ease-in-out infinite; }
</style>
<div class="card">
  <span class="z a">Z</span><span class="z b">Z</span><span class="z c">Z</span>
  <svg class="dog" viewBox="0 0 100 82" role="img" aria-label="Goddard, asleep">
    <defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ECEEF1"/><stop offset="1" stop-color="#A3A9B1"/></linearGradient></defs>
    <rect x="1.5" y="1.5" width="97" height="79" rx="18" fill="url(#s)" stroke="#5F656D" stroke-width="3"/>
    <path d="M14 29 Q25.5 37 37 29" fill="none" stroke="#16191E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M63 29 Q74.5 37 86 29" fill="none" stroke="#16191E" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="50" cy="51" r="6.5" fill="#070707" stroke="#3A3F46" stroke-width="2"/><circle cx="50" cy="51" r="2.8" fill="#3B6E8F"/>
    <rect x="20" y="63" width="60" height="10" rx="4" fill="#16191E"/>
    <g><rect class="led" x="33.3" y="65" width="9.5" height="6" rx="1" fill="#BD8430"/><rect class="led" x="44.6" y="65" width="9.5" height="6" rx="1" fill="#BD8430"/><rect class="led" x="55.9" y="65" width="9.5" height="6" rx="1" fill="#BD8430"/><rect class="led" x="22" y="65" width="9.5" height="6" rx="1" fill="#5A4220" style="animation:none"/></g>
  </svg>
  <h1>Goddard's <b>napping</b></h1>
  <p><span class="dot"></span>Wakes up when a dog needs the browser.</p>
</div>
